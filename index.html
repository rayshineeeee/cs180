<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS 180 Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Inconsolata", monospace;
        color: #171717;
        background: #f7f7f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(560px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0 96px;
      }

      h1 {
        margin: 0 0 56px;
        font-size: clamp(2rem, 3.5vw, 2.75rem);
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.08;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        display: flex;
        align-items: center;
        min-height: 56px;
        padding: 14px 18px;
        border: 1px solid #b8b8b3;
        color: inherit;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        transition:
          color 120ms ease,
          background 120ms ease,
          border-color 120ms ease;
      }

      a:hover,
      a:focus-visible {
        border-color: #171717;
        color: #f7f7f5;
        background: #171717;
        outline: none;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 28px, 560px);
          padding-top: 36px;
        }

        h1 {
          margin-bottom: 40px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CS 180 Projects</h1>
      <nav aria-label="Course projects">
        <a href="./proj0/">Project 0</a>
        <a href="./proj1/">Project 1</a>
        <a href="./proj2/">Project 2</a>
        <a href="./proj3/">Project 3</a>
        <a href="./proj4/">Project 4</a>
        <a href="./proj5/">Project 5</a>
      </nav>
    </main>
  </body>
</html>
