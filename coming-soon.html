<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coming Soon | CS 180</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Inconsolata", monospace;
        color: #171717;
        background: #f7f7f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        width: min(560px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0 96px;
      }

      h1 {
        margin: 0 0 40px;
        font-size: clamp(2rem, 3.5vw, 2.75rem);
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.08;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 12px 18px;
        border: 1px solid #171717;
        color: inherit;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        color: #f7f7f5;
        background: #171717;
        outline: none;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 28px, 560px);
          padding-top: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming soon.</h1>
      <a href="./">Back to projects</a>
    </main>
  </body>
</html>
